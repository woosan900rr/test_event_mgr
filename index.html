<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動作テスト画面</title>
</head>
<body>
    <h1>マッチングシステム 動作テスト</h1>
    <button onclick="location.href='./scan.html'" style="padding: 15px; background: #00bcd4; color: white; border: none; border-radius: 5px; font-size: 16px; margin-bottom: 20px; cursor: pointer;">
   	// カメラを起動してQRコードを読み取る
	</button>
    
    <p>テスト用のQRコード読み込みを再現します。下のボタンを押してみてください。</p>
    <button onclick="testScan('code001')">ユーザー1 (code001) のページを別タブで開く</button>
    <button onclick="testScan('code002')">ユーザー2 (code002) のページを別タブで開く</button>

    <script>
        function testScan(code) {
            // 本番環境では、これがQRコードから読み取ったURLになります
            // 今回は別タブ（_blank）でパーソナルページ（仮）を開きます
            const targetUrl = `./profile-view.html?code=${code}`;
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
